<link rel="stylesheet" href="/{{#plugin_name#}}/static/css/style.css">
<style>
    .bt-plugin-stl {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 60px 20px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
        color: #555;
    }

    .bt-plugin-stl .logos {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 24px;
    }

    .bt-plugin-stl .logos img {
        width: 48px;
        height: 48px;
        border-radius: 8px;
    }

    .bt-plugin-stl .logos .plus {
        font-size: 20px;
        color: #ccc;
    }

    .bt-plugin-stl h2 {
        margin: 0 0 6px;
        font-size: 18px;
        font-weight: 600;
        color: #333;
    }

    .bt-plugin-stl .version {
        font-size: 12px;
        color: #999;
        margin-bottom: 30px;
    }

    .bt-plugin-stl .btn {
        padding: 8px 24px;
        border: none;
        border-radius: 4px;
        background: #20a53a;
        color: #fff;
        font-size: 13px;
        cursor: pointer;
        transition: background 0.2s;
    }
</style>
<div class="bt-form">
    <div class="bt-w-main">
        <div class="bt-w-menu">
            <div class="stl-nav-items stl-nav-top">
                <div class="stl-nav-item active" onclick="BTPlugin.showPage('home')">
                    <i class="bi bi-house-door"></i>
                    <span>概览</span>
                </div>
                <div class="stl-nav-item" onclick="BTPlugin.showPage('tavern')">
                    <i class="bi bi-list-ul"></i>
                    <span>酒馆选项</span>
                </div>
                <div class="stl-nav-item" onclick="BTPlugin.showPage('versions')">
                    <i class="bi bi-clock-history"></i>
                    <span>版本管理</span>
                </div>
                <div class="stl-nav-item" onclick="BTPlugin.showPage('extensions')">
                    <i class="bi bi-puzzle"></i>
                    <span>扩展管理</span>
                </div>
                <div class="stl-nav-item" onclick="BTPlugin.showPage('resources')">
                    <i class="bi bi-folder2-open"></i>
                    <span>资源管理</span>
                </div>
            </div>
            <div class="stl-nav-items stl-nav-bottom">
                <div class="stl-nav-item" onclick="BTPlugin.showPage('console')">
                    <i class="bi bi-terminal"></i>
                    <span>控制台</span>
                </div>
                <div class="stl-nav-item" onclick="BTPlugin.showPage('settings')">
                    <i class="bi bi-gear"></i>
                    <span>设置</span>
                </div>
                <div class="stl-nav-item" onclick="BTPlugin.showPage('debug')" style="color:#999;">
                    <i class="bi bi-bug"></i>
                    <span>调试</span>
                </div>
            </div>
        </div>
        <div class="bt-w-con pd15">
            <div class="plugin_body" style="max-height: 100%; overflow-y: auto; overflow-x: hidden;"></div>
        </div>
    </div>
</div>

<script type="text/javascript" src="/{{#plugin_name#}}/static/js/pages/console.js"></script>
